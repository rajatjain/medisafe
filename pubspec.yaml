name: medisafe
description: Offline medication reminders and dose history.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  path_provider: ^2.1.6
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
